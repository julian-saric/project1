<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Website Job Application Form">
    <meta name="keywords" content="apply, form, html, css">
    <meta name="author" content="Julian Saric">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Form</title>
    <link href="/project1/styles/styles.css" rel="stylesheet">
</head>
<body id="apply_body">
    <!--Header with links to other pages-->
    <header>
        <h1 id="apply_h1">Job Application Form</h1>
        <nav>
            <ul class="menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="jobs.html">Jobs</a></li>
                <li><a href="apply.html">Apply</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="mailto:info@techcareerhub.com.au">Contact</a></li>
            </ul>
        </nav>
    </header>


    <form action="https://mercury.swin.edu.au/it000000/formtest.php" method="post">

    <!--Details fieldset-->
    <br>
    <fieldset id="apply_details_fieldset">
        <legend id="apply_details"><strong>--- Details ---</strong></legend>
        <p>
            <!--Drop down menu for reference numbers-->
            <label for="job_ref">Job Reference Number</label>
            <select name="Job Reference Number" id="job_ref" required="required">
                <option value="">Please Select</option>
                <option value="ref1">FE123</option>
                <option value="ref2">CS509</option>
            </select>
        </p>

        <p>
            <!--Text inpts for Firstname and Lastname-->
            <label for="first_name">First Name</label>
            <input type="text" name="first_name" id="first_name" pattern="[a-zA-Z]{1,15}" required="required">
            <label for="last_name">Last Name</label>
            <input type="text" name="last_name" id="last_name" pattern="[a-zA-Z]{1,15}" required="required">
        </p>
        <p>
            <!--Calender select for birthdate-->
            <label>Date of Birth<input type="date" name="date_of_birth" required="required" ></label>
        </p>
            <p>Gender</p>
        <p>
            <!--Radio buttons for gender-->
            <label><input type="radio" name="gender" value="Male" checked="checked">Male</label>
            <label><input type="radio" name="gender" value="Femal">Female</label>
            <label><input type="radio" name="gender" value="Other">Other</label>
        </p>
    </fieldset>
    <br>

    <!--Address Fieldset-->
    <fieldset id="apply_address_fieldset">
        <legend id="apply_address"><strong>--- Address ---</strong></legend>
        <p>
            <!-- Text input for street address and suburb -->
            <label for="street_address">Street Address</label>
            <input type="text" name="street_address" id="street_address" pattern="{1,40}" required="required">
        </p>
        <p>
            <label for="suburb_town">Suburb/Town</label>
            <input type="text" name="suburb_town" id="suburb_town" pattern="[a-zA-Z{1,40}" required="required">
        </p>
        <p>
            <!--Dropdown menu to choose state-->
            <label for="state">State</label>
            <select name="state" id="state" required="required">
                <option value="">Select State</option>
                <option value="VIC">Victoria</option>
                <option value="NSW">New South Wales</option>
                <option value="QLD">Queensland</option>
                <option value="NT">Northern Territory</option>
                <option value="WA">Western Australia</option>
                <option value="SA">South Australia</option>
                <option value="TAS">Tasmania</option>
                <option value="ACT">ACT</option>
            </select>
        </p>
        <p>
            <!-- Text input for postcode, only allows 4 numbers from 0-9 -->
            <label for="postcode">Postcode</label>
            <input type="text" name="postcode" id="postcode" pattern="[0-9]{4}" required="required">
        </p>
    </fieldset>
    <br> 

    <!--Contact details fieldset-->
    <fieldset id="apply_contact_fieldset">
        <legend id="apply_contact"><strong>--- Contact Details ---</strong></legend>
        <p>
            <!--text input for email-->
            <label for="email_address">Email</label>
            <input type="email" name="email_address" id="email_address" placeholder="name@domain.com" required="required">
        </p>
        <p>
            <!--Text input for phone number, allows 8-12 numbers from 0-9 as well as spaces-->
            <label for="phone_number">Phone Number</label>
            <input type="text" name="phone_number" id="phone_number" pattern="[0-9\s]{8,12}" required="required">
        </p>
    </fieldset>
    <br>

    <!--Work Requirements fieldset-->
    <fieldset id="apply_work_fieldset">
        <legend id="apply_work"><strong>--- Work Requirements ---</strong></legend>
        <p>
            <!--Checkbox to select relevant skills, first skill automatically selected-->
            Required Technical Skills
            <br>
            <label><input type="checkbox" name="skill[]" value="skill1" checked="checked" required="required">SQL</label><br>
            <label><input type="checkbox" name="skill[]" value="skill2">HTML5</label><br>
            <label><input type="checkbox" name="skill[]" value="skill3">CSS3</label><br>
            <label><input type="checkbox" name="skill[]" value="skill4">Microsoft Excel</label><br>
            <label><input type="checkbox" name="skill[]" value="skill5">JavaScript</label><br>
            <label><input type="checkbox" name="skill[]" value="skill6">GitHub</label><br>
        </p>

        <p>
            <!-- Text area for other skills, not required to submit form-->
            <label>Other Skills <em>(Optional)</em></label>
            <br>
            <textarea name="other_skills" rows="10" cols="50" placeholder="other skills here......"></textarea>
        </p>
    </fieldset>

    <br>

    <!--Submit and reset form buttons-->
    <div class="apply_submitReset">
    <p>
        <input type="submit" value="Apply">
        <input type="reset" value="Reset Form">
    </p>
</div>
        
    </form>

    <!--Footer with copyright-->
    <footer>
        <p>&copy; 2025 Tech Career Hub. All rights reserved.</p>
    </footer>
</body>
</html>
